name: Public client checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint:docs
      - run: python scripts/check_docs.py
      - run: python scripts/check_public.py

  infrastructure-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan source and history (redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
      - name: Compile only (no Azure login)
        env:
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
        run: |
          az bicep install --version v0.38.33
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/foundry-template.json"
      - name: Build and inspect clean artifacts
        run: |
          python scripts/build_release.py
          python scripts/verify_release.py dist/foundry-client-2.0.0.zip
          "$RUNNER_TEMP/gitleaks" dir dist --max-archive-depth 3 --redact --no-banner
